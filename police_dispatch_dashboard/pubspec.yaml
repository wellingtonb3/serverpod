name: police_dispatch_dashboard
description: >
  Police Dispatch Dashboard — real-time map interface for monitoring
  patrol vehicle positions and managing incident dispatch in São Paulo.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Serverpod client — connects to the dispatch server
  police_dispatch_client:
    path: ../police_dispatch_client

  # OpenStreetMap-based map widget (no API key required)
  flutter_map: ^7.0.2

  # Geographic coordinate utilities
  latlong2: ^0.9.1

  # HTTP client (used by flutter_map tile providers)
  http: ^1.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Icons and UI polish
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
