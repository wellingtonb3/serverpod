# Police Dispatch System — local development stack
#
# Services:
#   - postgres   : Primary database
#   - redis      : Message broker for WebSocket broadcasting (optional but recommended)
#   - server     : Serverpod dispatch server
#
# Usage:
#   docker compose up -d postgres redis
#   dart run bin/main.dart --apply-migrations --role maintenance  # run migrations
#   dart run bin/seed.dart --apply-migrations                     # seed data
#   dart run bin/main.dart                                        # start server

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: police_dispatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set the local credentials}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d   # auto-run migrations on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Copy .env.example to .env and set the local credentials}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Copy .env.example to .env and set the local credentials}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: ./police_dispatch_server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVERPOD_PASSWORD_database: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set the local credentials}
      SERVERPOD_PASSWORD_redis: ${REDIS_PASSWORD:?Copy .env.example to .env and set the local credentials}
      SERVERPOD_PASSWORD_serviceSecret: ${SERVERPOD_SERVICE_SECRET:?Copy .env.example to .env and set the local credentials}
    ports:
      - "8080:8080"   # API / WebSocket
      - "8081:8081"   # Insights
      - "8082:8082"   # Web

volumes:
  postgres_data:
