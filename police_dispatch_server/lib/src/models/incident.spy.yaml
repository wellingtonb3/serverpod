### Incident model
### Represents an emergency call requiring police, firefighters, or both.

class: Incident
table: incident
fields:
  description: String        # Free-text description of the incident
  address: String?           # Address selected when the incident was reported
  latitude: double           # GPS latitude of the incident location
  longitude: double          # GPS longitude of the incident location
  status: String             # 'open' | 'dispatched' | 'closed'
  sectorId: String           # Sector where the incident occurred
  requestedServices: String? # Comma-separated: police, firefighters
  assignedVehicleId: int?    # FK to the vehicle assigned to this incident
  assignedFireVehicleOneId: int?
  assignedFireVehicleTwoId: int?
  createdAt: DateTime        # Timestamp when the incident was created
  closedAt: DateTime?        # Timestamp when the incident was resolved

indexes:
  incident_status_idx:
    fields: status
  incident_sector_idx:
    fields: sectorId
